# Builds ghcr.io/eretuk/docker-rustic-backup (amd64 + arm64) for every v* tag.
# Run it by hand with `ref` to (re)build an existing tag.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v0.2.15)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eretuk/docker-rustic-backup:${{ env.REF }}
            ghcr.io/eretuk/docker-rustic-backup:latest
          labels: org.opencontainers.image.source=https://github.com/Eretuk/docker-rustic-backup
          cache-from: type=gha
          cache-to: type=gha,mode=max
